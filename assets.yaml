# 資産の台帳：45m 鏡の観測制御
# 項目の定義はハブの assets/README.md を参照。
#   https://github.com/nobeyama-radio-observatory/nro-context/blob/main/assets/README.md
# 2026-11-18 に、ハブの仮置きの台帳（assets/nro45m.yaml）から sw-cosmos を移し、
# 操作のユーザーインターフェースとリモート観測のシステムを加えた（判断記録 0006）。
# 公開資料と40周年記念誌から AI が埋め、聞き取り（interviews/）で補った。
#
# 接続先、ネットワーク構成、アクセスの方式など、制御と情報セキュリティの詳細は書かない。
# この台帳にない id の置き場所は、ハブの assets/README.md の資産の索引で引ける。
#
# 出典の略記
#   障害情報：NRO45m 障害情報 https://www.nro.nao.ac.jp/projects/45m/projects-45m-trouble/ （2026年11月12日更新の版）
#   年次報告YYYY：https://www.nao.ac.jp/contents/about/reports/annual-report-ja/annualYYYY-j.pdf
#   40周年記念誌：『野辺山宇宙電波観測所40周年記念誌』2022年2月（国立国会図書館 請求記号 MB12-M7）。p.N はそのページ。
#     書誌の詳細はハブの history/README.md の出典の略記。年次報告と食い違うときは年次報告を採る
#   聞き取りYYYY-MM-DD(-n) 問N：interviews/YYYY-MM-DD(-n).md の問N

- id: sw-cosmos
  name: COSMOS（観測制御ソフトウェア）
  kind: ソフトウェア
  part_of: nro45m
  depends_on: [ctl-computers, nro45m-acu]
  status: 運用中
  introduced: >-
    第1・第2世代は大型汎用計算機で動いた。1997年の第3世代から、ワークステーションの分散システムになった
    （アンテナ、受信機、分光計などを別々の計算機が制御し、マネージャーが指示書を読んでまとめて扱う）。
    2013年に OS を Solaris から Linux に変更。2018年に仮想計算機でハードウェアを集約し、第3から第4世代にあたる
  maintenance:
    by: 所内、メーカー
    condition: >-
      夏の定期の保守で OS の更新などを行う。最近は緊急度の高いセキュリティの更新が多く、頻度を少し上げている。
      追尾計算には初期の COSMOS の Fortran のコードを使い続けている。ソフトウェアの64ビット化を進めており、2038年問題には対応済み（2021年度末の時点）。
      計算機の更新は2008年度、2013年度、2018年度に行い、その後は大規模な更新をしていない
    effort: 小
  renewal: 観測システムの web UI 化と、リモート観測のアクセスの方式の見直しを、計算機の更新と合わせて来年度か再来年度（2027〜2028年度）に行う予定
  owner_role: 計算機グループ
  maintainers: 1
  sources:
    - 名称と役割：障害情報 Trouble ID 2026-2、Trouble ID 2026-5
    - 第3世代の報告：年次報告2002（論文の一覧にある COSMOS-3 の報告）
    - 世代、構成の方針、保守の状況：40周年記念誌 p.56
    - 計算機の更新の年：40周年記念誌 p.57、p.58
    - 保守の手間と状況、担い手の数、メーカーの支援：聞き取り2026-11-18 問3、問4
    - 更新の見込み：聞き取り2026-11-18 問5
    - ほかの装置との関係：聞き取り2026-11-18 問6
    - 担当：聞き取り2026-11-18 問1
  note: >-
    ASTE の観測制御も COSMOS と呼ばれる（40周年記念誌 p.56）。新しい受信機や分光計を入れるたびに更新しており、分散型の構成がそれを容易にしてきた。
    ACU のインターフェースが変われば COSMOS の改修も要る。YATSUGATAKE の最終版の連携ソフトウェア（YKSP-LC）は COSMOS のマネージャーにつながる予定（聞き取り2026-11-18 問6）

- id: sw-obs-ui
  name: 観測の操作のユーザーインターフェース（マネージャー画面、クイックルック、アンテナコンソール、スキャンモニタなど）
  kind: ソフトウェア
  part_of: sw-cosmos
  depends_on: [sw-cosmos]
  status: 運用中
  maintenance: {by: 所内, condition: 成熟しており、トラブルはほとんどない。観測の支援として利用者を補助することがあり、利用者が独習できるマニュアルの整備が課題, effort: 小}
  renewal: web UI 化を、計算機の更新と合わせて来年度か再来年度（2027〜2028年度）に行う予定
  owner_role: 計算機グループ
  maintainers: 未記入
  sources:
    - 構成：40周年記念誌 p.56（マネージャー画面の図の説明）
    - 保守の手間と状況：聞き取り2026-11-18 問7
    - 更新の見込み：聞き取り2026-11-18 問5
    - 担当：聞き取り2026-11-18 問1
  note: 2018年度の計算機の更新で、COSMOS の観測画面をすべて仮想計算機に移した（40周年記念誌 p.58）

- id: sw-remote-obs
  name: リモート観測のシステム
  kind: ソフトウェア
  part_of: nro45m
  depends_on: [sw-cosmos, sw-obs-ui]
  status: 運用中
  introduced: >-
    2011年度に検討を始めた。三鷹からの観測（Ver.0）を2012年度に試験運用し、2013年度から本運用。
    大学などからの観測（Ver.1）を2017年度から、音声も届ける方式（Ver.2）を2018年度から運用。2019年度から共同利用の観測はリモートが主体
  maintenance: {by: 所内, condition: 成熟しており、トラブルはほとんどない。ただし、画面を転送する方式のため、国外から観測すると画面の動きが遅く、使い勝手が悪い, effort: 小}
  renewal: 画面を転送する方式をやめ、web UI での観測に切り替えたい。アクセスの方式も見直す。計算機の更新と合わせて来年度か再来年度（2027〜2028年度）に行う予定
  owner_role: 計算機グループ
  maintainers: 未記入
  sources:
    - 導入：40周年記念誌 p.58
    - 保守の手間と状況：聞き取り2026-11-18 問5、問7、問8
    - 更新の見込みとその理由：聞き取り2026-11-18 問5、問8
    - 担当：聞き取り2026-11-18 問1
    - リモートが主体になったこと：ハブの history/README.md（2019年度、技術シンポ2019）
  note: >-
    東アジアの大学からは、操作性の理由でいまも Ver.1 の方式を使う（40周年記念誌 p.58）。方式の詳細（接続、アクセスの管理、回線）は書かない。
    国外の利用者は望遠鏡の使用料が高く設定されており、観測所は国外の利用者の比率を高めたい。そのため国外からのリモート観測を滑らかにすることが重要（聞き取り2026-11-18 問8）

- id: ctl-computers
  name: 制御用の計算機と仮想化の基盤
  kind: 計算機
  part_of: nro45m
  status: 運用中
  introduced: 2018年度の更新で、仮想計算機を使ってハードウェアを集約した
  maintenance: {by: 所内、メーカー, condition: 夏の定期の保守で OS の更新などを行う。セキュリティの更新の頻度を上げている, effort: 小}
  renewal: 2018年度の後、大規模な更新はしていない。来年度か再来年度（2027〜2028年度）に、web UI 化と合わせて更新する予定
  owner_role: 計算機グループ
  maintainers: 1
  sources:
    - 導入：40周年記念誌 p.56、p.58
    - 範囲、保守、担い手の数、更新の見込み：聞き取り2026-11-18 問2〜問5
    - 担当：聞き取り2026-11-18 問1
  note: 所内の共通のサービス用の仮想化の基盤は、このまとまりに含めない（聞き取り2026-11-18 問2）。保守の状況と担い手の数は COSMOS についての答えを当てはめたもの
